# Combined queries for ReviewMyCoach Data Connect
# Using camelCase for all field names

# ============================================
# User Queries
# ============================================

query GetUser($id: String!) @auth(level: USER) {
  user(id: $id) {
    id
    userId
    email
    displayName
    username
    firstName
    lastName
    role
    onboardingCompleted
    isVerified
    createdAt
    updatedAt
  }
}

query GetUserByEmail($email: String!) @auth(level: USER) {
  users(where: {email: {eq: $email}}) {
    id
    userId
    email
    displayName
    username
    role
    onboardingCompleted
    isVerified
  }
}

query GetUserByUsername($username: String!) @auth(level: PUBLIC) {
  users(where: {username: {eq: $username}}) {
    id
    username
    displayName
  }
}

query CheckUsernameAvailability($username: String!) @auth(level: PUBLIC) {
  users(where: {username: {eq: $username}}) {
    id
    username
  }
}

# ============================================
# Coach Queries
# ============================================

query GetCoach($id: String!) @auth(level: PUBLIC) {
