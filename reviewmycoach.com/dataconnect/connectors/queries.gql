    username
    userId
    displayName
    email
    phoneNumber
    bio
    sports
    specialties
    certifications
    location
    organization
    school
    role
    gender
    ageGroup
    availability
    languages
    website
    socialMedia
    hourlyRate
    experience
    averageRating
    totalReviews
    profileImage
    isVerified
    isClaimed
    sourceUrl
    subscriptionStatus
    subscriptionTier
    longevityPlatformYears
    careerYears
    coursesCreated
    jobsCompleted
    consistencyMultiplier
    totalXp
    activeCardId
    activeCardImageUrl
    createdAt
    updatedAt
  }
}

query GetCoachByUsername($username: String!) @auth(level: PUBLIC, insecureReason: "Public coach profiles are a core feature") {
